[project]
name = "module-creator-core"
version = "0.0.1"
description = "ADHD Framework core: module_creator_core"
requires-python = ">=3.11"
dependencies = [
    "config-manager",
    "logger-util",
    "creator-common-core",
    "exceptions-core",
    "github-api-core",
    "modules-controller-core",
    "questionary-core",
    "yaml-reading-core",
]

[project.urls]
Repository = "https://github.com/AI-Driven-Highspeed-Development/module_creator_core.git"

[tool.adhd]
type = "core"
layer = "dev"

[tool.uv.sources]
config-manager = { workspace = true }
logger-util = { workspace = true }
creator-common-core = { workspace = true }
exceptions-core = { workspace = true }
github-api-core = { workspace = true }
modules-controller-core = { workspace = true }
questionary-core = { workspace = true }
yaml-reading-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build]
dev-mode-dirs = [".."]
